name: Dependency security audit

on:
  push:
    branches: ["main"]
    paths:
      - "release/web-demo/requirements.txt"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "release/web-demo/requirements.txt"
  schedule:
    # Weekly, even if nothing changed, so newly-disclosed CVEs are caught.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          pip install --upgrade pip
          pip install pip-audit

      - name: Audit pinned dependencies for known CVEs
        run: pip-audit -r release/web-demo/requirements.txt --fix
